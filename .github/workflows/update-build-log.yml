name: Update build log

on:
  schedule:
    - cron: "17 3 * * *"   # ~08:47 IST daily
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python scripts/build_stats_svg.py
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}

      - name: Commit updated stats if changed
        run: |
          git config user.name "build-log-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats-light.svg stats-dark.svg
          git diff --cached --quiet || git commit -m "chore: refresh build log stats"
          git push
